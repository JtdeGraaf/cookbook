<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookbook · Kookboek</title>
    <meta
      name="description"
      content="A personal bilingual cookbook (English and Dutch): recipes with the prep done before anything goes in a hot pan, scalable ingredients and step timers."
    />
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23c93f1f'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23f0b323'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Set the theme before the first paint so dark mode never flashes white.
      try {
        var saved = JSON.parse(localStorage.getItem('cookbook:theme'))
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: A Japanese home-cooking book (mook) for a Dutch kitchen: prep is a boxed list you finish before the
      numbered method begins. Refuses the cream-paper serif cookbook and the recipe-card grid.
      OWN-WORLD: Coated white paper, sumi ink, rounded gothic (Zen Maru Gothic / Zen Kaku Gothic New); one strong
      colour per chapter (tomato, yolk, plum, matcha, sea) on thumb-index tabs, ingredient box headers and
      filled step circles; dotted leaders between ingredient and amount; "Point" hint tags. Dark mode is the
      same book under a night-kitchen pendant: ink-black paper, lifted chapter colours.
      STORY: The reader opens the contents, picks a recipe from a spread, ticks off the mise en place, then cooks
      one numbered step at a time with timers ringing from the tray, ingredients one tap away.
      FIRST VIEWPORT: Mook cover: huge rounded masthead left with a round tomato seal "Prep first, then the pan",
      collage of dish photos right; contents with coloured chapter bands starts below.
      FORM: candidate 7 of 7 (Japanese home-cooking mook), seed key bdca51e6.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
